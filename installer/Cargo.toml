[package]
name = "discord-taskbar-installer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Setup for Discord Taskbar"

[[bin]]
name = "DiscordTaskbarSetup"
path = "src/main.rs"

[dependencies]
# The application binary is embedded in this one, so setup is a single file
# somebody can hand to a friend. The widget's controls and config paths are
# reused so the wizard writes exactly what the app reads, and the Discord
# crate says where the credentials it collects belong.
taskbar-widget.workspace = true
discord-integration.workspace = true
windows.workspace = true
