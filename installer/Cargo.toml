[package]
name = "discord-taskbar-installer"
version = "0.1.0"
edition = "2021"
description = "Setup for Discord Taskbar"
publish = false

[[bin]]
name = "DiscordTaskbarSetup"
path = "src/main.rs"

[dependencies]
# The application binary is embedded in this one, so setup is a single file
# somebody can hand to a friend. `Config` is reused from the library so the
# credentials the wizard collects are written in exactly the format the app
# reads.
discord-taskbar = { path = ".." }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
]
