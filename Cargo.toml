[workspace]
# The installer is a second binary that embeds the first, so it must build
# after it. `make-installer.sh` sequences the two.
members = ["installer"]

[package]
name = "discord-taskbar"
version = "0.1.0"
edition = "2021"
description = "Discord voice status in the Windows taskbar"
publish = false

[lib]
name = "discord_taskbar"
path = "src/lib.rs"

[[bin]]
name = "discord-taskbar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
